# KX Docker Compose — Preview site (Port 3001)
# ============================================
# The legacy "main" container (port 3000, C:/Users/hp/KingdomTradeX) was
# decommissioned 2026-09: code lives on GitHub (KTX), data in Supabase,
# operational JSON mirror under KingdomTradeX-GitHub-Site/data.

services:
  # ---------------------------------------------------------------
  # Preview container — Port 3001 (GitHub clone, auto-pull on start)
  # Self-contained: Linux node_modules baked into image.
  # Source code stored in persistent named volume (git pull on start).
  # Source synced into image directory via rsync (preserves node_modules).
  # ---------------------------------------------------------------
  kingdomtradex-preview:
    build:
      context: C:/Users/hp/KingdomTradeX-GitHub-Site
      dockerfile: Dockerfile-preview-selfcontained
    container_name: kingdomtradex-preview
    restart: always
    ports:
      - "3001:3001"
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - WS_PORT=3002
      - FINNHUB_KEY=***
      - TWELVEDATA_KEY=75516685485a4e8fa162d839a5fcabc8
      - GH_TOKEN=ghp_AxmeeM4GgP6Z6Y10kBfnIHpBgn3s0MPv
    volumes:
      # Persistent git repo + source code (Docker-managed named volume)
      # Data folder only (separate from main data)
      - C:/Users/hp/KingdomTradeX-GitHub-Site/data:/app/data
      # Supabase env (anon + service_role keys). NOT baked into the image and
      # NOT committed; git-bash tar sends .env.local but the Dockerfile never COPYs it.
      - C:/Users/hp/KingdomTradeX-GitHub-Site/.env.local:/app/.env.local:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  preview-src:
    name: kingdomtradex-preview-src

# ============================================
# Commands:
#   docker compose -f dockercompose-all.yml up -d        # Start both
#   docker compose -f dockercompose-all.yml down         # Stop both
#   docker compose -f dockercompose-all.yml build        # Rebuild both images
#   docker compose -f dockercompose-all.yml logs -f      # Follow all logs
#   docker compose -f dockercompose-all.yml logs -f main  # Main logs
#   docker compose -f dockercompose-all.yml logs -f preview # Preview logs
#
# Autostart: (the old "KingdomTradeX" logon task pointing at the deleted
# folder was removed; preview is brought up by hermes-boot/start scripts)
# Compose up: docker compose -f dockercompose-all.yml up -d kingdomtradex-preview
# Legacy note: Windows Scheduled Task formerly ran:
#   docker compose -f "C:\Users\hp\KingdomTradeX\dockercompose-all.yml" up -d
#   at Windows logon
#
# Update preview: docker compose -f dockercompose-all.yml restart kingdomtradex-preview
#   (restarts → git pull → serves latest GitHub version on 3001)
# ============================================
